name: CI

on:
  push:
    branches: [main]
    # A version tag publishes the snap to the candidate channel.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go mod tidy is a no-op
        run: go mod tidy -diff
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          # Built with the Go version of this module, which may be newer
          # than the one the released binary was built with.
          install-mode: goinstall

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test -race
        run: go test -race -count=1 ./...
      # A short pass on every run; a failing input is saved under
      # internal/menu/testdata/fuzz and then runs as a normal test.
      - name: Fuzz the menu parser
        run: go test -run='^$' -fuzz=FuzzParse -fuzztime=30s ./internal/menu

  govulncheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write a dummy .env
        run: |
          {
            echo "TELEGRAM_BOT_TOKEN=0000000000:dummy-token-for-ci"
            echo "HASH_SECRET=$(openssl rand -hex 32)"
            echo "GITHUB_TOKEN=dummy-token-for-ci"
            echo "GITHUB_REPO=example/example"
            echo "HUGO_BASE_URL=https://example.github.io/decarta-site"
          } > .env
      - name: Build the image
        run: docker compose build
      - name: Start and wait for a healthy container
        run: docker compose up --detach --wait --wait-timeout 120
      - name: Check the runtime hardening
        run: |
          id="$(docker compose ps -q bot)"
          docker inspect --format \
            'user={{.Config.User}} read_only={{.HostConfig.ReadonlyRootfs}} health={{.State.Health.Status}}' \
            "$id" | tee /tmp/inspect.txt
          grep -qx 'user=65532:65532 read_only=true health=healthy' /tmp/inspect.txt
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down --volumes

  snap:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the snap version comes from git describe
      - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: build
      - name: Install the snap
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: |
          sudo snap install --dangerous "$SNAP_FILE"
          # A service gets no command in /snap/bin; "snap run" starts the
          # same binary under the same confinement.
          snap run decarta-bot --version
          snap connections decarta-bot
      - name: The service waits to be configured
        run: |
          snap services decarta-bot | tee /tmp/services.txt
          grep -Eq '^decarta-bot(\.decarta-bot)? +disabled +inactive' /tmp/services.txt
      - name: Configure, start and check the health endpoint
        run: |
          {
            echo "TELEGRAM_BOT_TOKEN=0000000000:dummy-token-for-ci"
            echo "HASH_SECRET=$(openssl rand -hex 32)"
            echo "GITHUB_TOKEN=dummy-token-for-ci"
            echo "GITHUB_REPO=example/example"
            echo "HUGO_BASE_URL=https://example.github.io/decarta-site"
          } | sudo install -m 600 /dev/stdin /var/snap/decarta-bot/common/.env
          sudo snap start --enable decarta-bot
          for _ in $(seq 1 30); do
            if sudo snap run decarta-bot -healthcheck 2>/dev/null; then break; fi
            sleep 1
          done
          sudo snap run decarta-bot -healthcheck
          curl --fail --silent http://127.0.0.1:8080/health
          sudo test -d /var/snap/decarta-bot/common/data
      - name: Logs
        if: always()
        run: sudo snap logs -n 50 decarta-bot || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snap-${{ runner.arch }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error
      # Publishing needs the store login of the snap's owner. Forks and
      # pull requests do not have it and stop after the checks above.
      - name: Is there a store login?
        id: store
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to the Snap Store
        if: steps.store.outputs.publish == 'true'
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          # main goes to edge; a version tag goes to candidate, and is
          # promoted to stable by hand after the smoke test.
          release: ${{ startsWith(github.ref, 'refs/tags/v') && 'candidate' || 'edge' }}
