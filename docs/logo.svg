<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Demenu logo</title>
  <desc id="d">A man turned to the left, delighted as he lifts a taco to his open mouth from a plate of tacos.</desc>
  <defs>
    <clipPath id="badge"><circle cx="256" cy="256" r="240"/></clipPath>
    <g id="taco">
      <!-- fillings sit behind the shell -->
      <g fill="#5DBB46">
        <circle cx="-44" cy="-4" r="15"/><circle cx="-22" cy="-13" r="17"/>
        <circle cx="2" cy="-16" r="18"/><circle cx="26" cy="-12" r="17"/><circle cx="46" cy="-3" r="14"/>
      </g>
      <circle cx="-30" cy="-6" r="9" fill="#E63946"/>
      <circle cx="12" cy="-10" r="10" fill="#E63946"/>
      <circle cx="-8" cy="-6" r="8" fill="#7A4A2B"/>
      <circle cx="34" cy="-4" r="8" fill="#7A4A2B"/>
      <!-- shell -->
      <path d="M-64 0A64 64 0 0 0 64 0Z" fill="#F6B93B"/>
      <path d="M-64 0A64 64 0 0 0 64 0" fill="none" stroke="#D98E1F" stroke-width="7" stroke-linecap="round"/>
      <g fill="#D98E1F"><circle cx="-24" cy="22" r="3.5"/><circle cx="6" cy="34" r="3.5"/><circle cx="28" cy="16" r="3.5"/></g>
    </g>
  </defs>

  <circle cx="256" cy="256" r="240" fill="#2EC4B6"/>
  <g clip-path="url(#badge)">
    <!-- shirt and neck -->
    <path d="M176 520C176 398 244 346 322 346s150 52 150 174Z" fill="#E4572E"/>
    <path d="M286 296h62v44a31 31 0 0 1-62 0Z" fill="#E3A476"/>

    <!-- head, turned to the left -->
    <circle cx="388" cy="236" r="19" fill="#F4B98B"/>
    <circle cx="300" cy="216" r="96" fill="#F4B98B"/>
    <ellipse cx="207" cy="236" rx="15" ry="12" fill="#F4B98B"/>
    <!-- hair, swept to the back -->
    <path d="M210 196C210 132 262 104 318 110c62 6 96 58 82 132-8-22-20-36-38-44-14-28-44-40-76-38-30 2-54 12-76 36Z" fill="#3B2A20"/>

    <!-- eyes fixed on the taco -->
    <g fill="none" stroke="#3B2A20" stroke-width="8" stroke-linecap="round">
      <path d="M228 184q14-10 28-4"/>
      <path d="M280 180q16-10 30 0"/>
    </g>
    <circle cx="244" cy="212" r="17" fill="#FFF"/>
    <circle cx="296" cy="210" r="17" fill="#FFF"/>
    <circle cx="237" cy="213" r="8.5" fill="#3B2A20"/>
    <circle cx="289" cy="211" r="8.5" fill="#3B2A20"/>
    <circle cx="234.500" cy="210" r="2.800" fill="#FFF"/>
    <circle cx="286.500" cy="208" r="2.800" fill="#FFF"/>
    <circle cx="246" cy="240" r="19" fill="#F4B98B"/>
    <circle cx="298" cy="238" r="19" fill="#F4B98B"/>
    <!-- cheek -->
    <circle cx="304" cy="256" r="17" fill="#F28B78" opacity=".7"/>
    <!-- mouth wide open for the bite -->
    <ellipse cx="244" cy="268" rx="27" ry="24" fill="#3B2A20"/>
    <path d="M221 258a27 24 0 0 1 46 0Z" fill="#FFF"/>
    <ellipse cx="248" cy="283" rx="15" ry="8" fill="#F0606B"/>
    <path d="M268 262q12-2 16-14" fill="none" stroke="#3B2A20" stroke-width="7" stroke-linecap="round"/>

    <!-- plate of tacos -->
    <ellipse cx="168" cy="416" rx="92" ry="20" fill="#DCE7E5"/>
    <ellipse cx="168" cy="411" rx="92" ry="18" fill="#FFF"/>
    <use href="#taco" transform="translate(134 400) rotate(-8) scale(.52)"/>
    <use href="#taco" transform="translate(200 402) rotate(6) scale(.52)"/>

    <!-- arm lifting a taco to the mouth -->
    <path d="M322 416C300 392 262 368 214 336" fill="none" stroke="#E4572E" stroke-width="44" stroke-linecap="round"/>
    <use href="#taco" transform="translate(180 292) rotate(-22) scale(.82)"/>
    <rect x="160" y="308" width="60" height="34" rx="17" fill="#F4B98B" transform="rotate(-22 190 325)"/>
  </g>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#1B7F77" stroke-width="10"/>
</svg>
