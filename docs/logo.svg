<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Decarta logo</title>
  <desc id="d">A hand-drawn, retro style badge of a man turned to the left, happily biting into a taco.</desc>
  <defs>
    <clipPath id="badge"><circle cx="256" cy="256" r="232"/></clipPath>
    <!-- wobbly, hand-inked edges -->
    <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="9"/>
    </filter>
    <!-- paper grain -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 .17  0 0 0 0 .13  0 0 0 0 .09  0 0 0 -1.1 .62"/>
    </filter>

    <!-- shapes, drawn twice below: once as flat colour, once as ink line -->
    <path id="shirt" d="M168 520C170 400 240 350 320 350s152 50 152 170Z"/>
    <path id="neck" d="M288 292h60v46a30 30 0 0 1-60 0Z"/>
    <circle id="ear" cx="384" cy="240" r="18"/>
    <path id="head" d="M300 126c56 0 94 42 94 96s-40 94-94 94c-46 0-80-26-90-62-12 0-22-8-22-18s8-18 20-18c6-52 42-92 92-92Z"/>
    <path id="hair" d="M208 204c-2-62 44-98 98-98 60 0 100 48 96 112-4 14-8 22-12 26-4-22-14-38-30-46-16-28-44-40-74-38-30 2-56 14-78 44Z"/>
    <path id="mouth" d="M218 256c16 8 38 6 54-6 6 30-6 52-26 54s-32-18-28-48Z"/>
    <path id="shell" d="M-70 0A70 70 0 0 0 70 0Z"/>
    <path id="lettuce" d="M-62 0c-6-16 6-26 18-20 2-16 22-20 30-8 8-14 30-12 34 2 12-10 30-2 28 12 10 0 14 8 12 14Z"/>
    <path id="arm" d="M330 424C306 396 266 368 216 340"/>
    <path id="hand" d="M158 330c-4-14 4-26 18-30l34-10c14-4 26 4 28 16s-4 22-18 26l-34 10c-14 4-24-2-28-12Z"/>
  </defs>

  <!-- badge -->
  <circle cx="256" cy="256" r="244" fill="#B9442B"/>
  <circle cx="256" cy="256" r="232" fill="#F1E0BC"/>
  <g clip-path="url(#badge)">
    <g fill="#E6CD98">
      <path d="M256 256L-40 150V60Z"/><path d="M256 256L40-40h100Z"/><path d="M256 256L230-40h90Z"/>
      <path d="M256 256L420-40h90Z"/><path d="M256 256L560 70v100Z"/><path d="M256 256L560 250v90Z"/>
      <path d="M256 256L-40 250v90Z"/><path d="M256 256L-40 430v90Z"/><path d="M256 256L560 430v90Z"/>
    </g>

    <g filter="url(#ink)" stroke-linejoin="round" stroke-linecap="round">
      <!-- flat colour, printed slightly off register -->
      <g transform="translate(6 5)">
        <use href="#shirt" fill="#2C6E68"/>
        <use href="#neck" fill="#D69A6A"/>
        <use href="#ear" fill="#E8B181"/>
        <use href="#head" fill="#E8B181"/>
        <use href="#hair" fill="#3A2A1E"/>
        <circle cx="306" cy="258" r="16" fill="#D9694A" opacity=".75"/>
        <use href="#mouth" fill="#7A2A1E"/>
        <use href="#arm" fill="none" stroke="#2C6E68" stroke-width="46"/>
      </g>

      <!-- ink line -->
      <g fill="none" stroke="#2B2118" stroke-width="7">
        <use href="#shirt"/>
        <path d="M290 352l32 30 30-30"/>
        <path d="M288 320v28M348 314v34"/>
        <use href="#head"/>
        <path d="M378 232c8-4 16 2 14 12"/>
        <!-- eyes on the taco, squeezed happy by the cheeks -->
        <path d="M228 190q14-10 26-2"/>
        <path d="M280 186q14-8 28 2"/>
        <path d="M232 222q10-12 22 0" stroke-width="8"/>
        <path d="M282 220q12-12 24 0" stroke-width="8"/>
        <use href="#mouth"/>
        <path d="M270 252q12-2 16-14"/>
        <use href="#arm" stroke-width="58"/>
      </g>
      <use href="#arm" fill="none" stroke="#2C6E68" stroke-width="44"/>

      <!-- the taco -->
      <g transform="translate(176 288) rotate(-20)">
        <g transform="translate(6 5)">
          <use href="#lettuce" fill="#7F9A3A"/>
          <circle cx="-34" cy="-8" r="9" fill="#B9442B"/><circle cx="14" cy="-12" r="10" fill="#B9442B"/>
          <circle cx="-10" cy="-8" r="8" fill="#6E4326"/><circle cx="38" cy="-4" r="8" fill="#6E4326"/>
        </g>
        <g fill="none" stroke="#2B2118" stroke-width="7">
          <use href="#lettuce"/>
          <use href="#shell" fill="#E2A52E"/>
          <path d="M-36 24h2M-6 42h2M24 22h2M0 14h2" stroke-width="6"/>
        </g>
      </g>
      <use href="#hand" fill="#E8B181" stroke="#2B2118" stroke-width="7"/>
      <path d="M186 304l8 22M206 298l8 22" fill="none" stroke="#2B2118" stroke-width="5"/>

      <!-- yum marks -->
      <path d="M150 196l-22-16M168 170l-10-26M132 228l-28-4" fill="none" stroke="#B9442B" stroke-width="7"/>
    </g>
    <rect width="512" height="512" filter="url(#grain)" opacity=".5"/>
  </g>
  <circle cx="256" cy="256" r="232" fill="none" stroke="#2B2118" stroke-width="6"/>
</svg>
