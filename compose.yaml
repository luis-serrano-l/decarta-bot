services:
  bot:
    build: .
    image: demenu-bot:local
    env_file: .env
    environment:
      # The only writable path in the container; overrides any value in .env.
      STORAGE_PATH: /data
    volumes:
      - demenu-data:/data
    # No ports are published: the bot long-polls Telegram and /health is
    # only probed from inside the container by the image HEALTHCHECK.
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    restart: unless-stopped

volumes:
  demenu-data:
