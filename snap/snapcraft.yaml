name: decarta-bot
base: core24
adopt-info: decarta-bot # the version comes from git, see parts
summary: Telegram bot that turns a restaurant menu into a web page
icon: snap/gui/icon.svg
description: |
  A restaurant owner sends a menu to the bot on Telegram, as a file or as
  text. The bot validates it, shows a preview and, once the owner taps
  Publish, commits it to a static site repository that serves the menu
  page. /qr returns a QR code of the page for the tables.

  The snap runs the bot as a service. It is installed stopped, because
  it needs a configuration first.

  **Configure**

  Create the file, readable by root only because it holds two tokens:

      sudo install -m 600 /dev/null /var/snap/decarta-bot/common/.env
      sudoedit /var/snap/decarta-bot/common/.env

  Put these lines in it, with your own values:

      TELEGRAM_BOT_TOKEN=<the token @BotFather gave you>
      HASH_SECRET=<32 or more random characters, e.g. from "openssl rand -hex 32">
      GITHUB_TOKEN=<a fine-grained token with "Contents: Read and write" on the site repository only>
      GITHUB_REPO=<owner/name of your copy of decarta-site>
      HUGO_BASE_URL=<https address of that site>
      ADMIN_USER_IDS=<your Telegram user ID; send /myid to the bot to see it>

  The first five are required. Without ADMIN_USER_IDS the bot runs but
  nobody may publish. Do not change HASH_SECRET later: it changes every
  menu address.

  **Commands**

      sudo snap start --enable decarta-bot    # start now and at every boot
      sudo snap restart decarta-bot           # after changing .env
      sudo snap stop --disable decarta-bot    # stop and keep it stopped
      sudo snap logs -f decarta-bot           # follow the log
      snap services decarta-bot               # is it running?
      snap run decarta-bot --version          # which version is installed

  The optional variables, how to create the two tokens and the full guide:
  https://github.com/luis-serrano-l/decarta-bot/blob/main/docs/how-to/run-as-snap.md
license: MIT
website: https://github.com/luis-serrano-l/decarta-bot
source-code: https://github.com/luis-serrano-l/decarta-bot
issues: https://github.com/luis-serrano-l/decarta-bot/issues

grade: stable
confinement: strict

platforms:
  amd64:
  arm64:

apps:
  decarta-bot:
    command: bin/decarta-bot
    daemon: simple
    # Without a configuration the bot can only exit, so the service waits
    # for the operator to start it.
    install-mode: disable
    restart-condition: on-failure
    restart-delay: 30s
    plugs:
      - network # Telegram and GitHub
      - network-bind # GET /health
    environment:
      # The same .env format as the other ways of running the bot. Values
      # set here win over the file.
      ENV_FILE: $SNAP_COMMON/.env
      STORAGE_PATH: $SNAP_COMMON/data

parts:
  decarta-bot:
    plugin: nil
    source: .
    build-snaps:
      - go/latest/stable
    build-packages:
      - git
    override-build: |
      version="$(git describe --tags --always | sed 's/^v//')"
      craftctl set version="$version"
      # The same build as the Dockerfile: static, stripped, versioned.
      CGO_ENABLED=0 go build -trimpath \
        -ldflags="-s -w -X main.version=$version" \
        -o "$CRAFT_PART_INSTALL/bin/decarta-bot" .
